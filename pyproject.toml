[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-assistant"
version = "0.1.0"
description = "Engineering-grade CLI travel-planning agent (LangChain 1.0 + LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.0.3",
    "langgraph==1.0.2",
    "langgraph-checkpoint-sqlite==2.0.1",
    "langchain-deepseek==0.1.4",
    "langchain-core==1.0.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "typer==0.12.5",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.7.1", "mypy==1.13.0", "pytest-cov==6.0.0"]

[project.scripts]
travel-assistant = "travel_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["travel_assistant"]
mypy_path = "src"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: real DeepSeek calls; skipped without DEEPSEEK_API_KEY"]
