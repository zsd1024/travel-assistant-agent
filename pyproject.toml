[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-assistant"
version = "0.1.0"
description = "Engineering-grade CLI travel-planning agent (LangChain 1.x + LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.3.1",
    "langgraph==1.2.0",
    "langgraph-checkpoint-sqlite==2.0.10",
    "langchain-deepseek==1.0.1",
    "langchain-core==1.4.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "typer==0.23.1",
    "click==8.1.8",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.15.13", "mypy==1.20.2", "pytest-cov==6.3.0"]

[project.scripts]
travel-assistant = "travel_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["travel_assistant"]
mypy_path = "src"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: real DeepSeek calls; skipped without DEEPSEEK_API_KEY"]
